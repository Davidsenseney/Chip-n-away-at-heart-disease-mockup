name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: home/package-lock.json

      - run: npm ci

      - name: Build
        env:
          VITE_WIX_CLIENT_ID: ${{ secrets.VITE_WIX_CLIENT_ID }}
          VITE_WIX_SITE_URL: ${{ secrets.VITE_WIX_SITE_URL }}
          VITE_WIX_DONATION_CAMPAIGN_ID: ${{ secrets.VITE_WIX_DONATION_CAMPAIGN_ID }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: home/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
