<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stlyesheet.css">
    <title>Contact Us - Chip'n Away</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
            
    <!-- Shared JavaScript reference -->
    <script src="javaScript.js" defer></script>

    <link rel="stylesheet" href="style.css">
</head>
<body class="font-sans antialiased flex flex-col min-h-screen">

    <!-- Shared Footer insert -->
    <div id="shared-header"></div>

    <!-- Contact Section -->
    <main class="flex-1">
        <section class="relative min-h-[80vh] flex items-center justify-center bg-apple-dark overflow-hidden py-20">
            <div class="absolute inset-0 bg-[radial-gradient(at_center,#1a2e05_0%,transparent_70%)]"></div>
            
            <div class="relative z-10 w-full max-w-2xl px-6">
                <div class="text-center mb-12">
                    <span class="inline-block px-6 py-2 bg-apple-red/10 text-apple-red text-sm font-medium tracking-widest rounded-full border border-apple-red/30 mb-6">
                        GET IN TOUCH
                    </span>
                    <h1 class="text-5xl md:text-6xl font-heading font-bold text-white leading-none tracking-tighter mb-4">
                        Contact Us
                    </h1>
                    <p class="text-xl text-apple-panel">
                        Join our mission to fight heart disease. We'd love to hear from you!
                    </p>
                </div>

                <!-- Contact Form -->
                <div class="bg-white rounded-3xl shadow-xl p-8 md:p-12 border border-apple-red/10">
                    <form id="contactForm" class="space-y-6">
                        <!-- First Name & Last Name Row -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label for="firstName" class="block text-sm font-semibold text-apple-dark mb-2">
                                    First Name <span class="text-apple-red">*</span>
                                </label>
                                <input 
                                    type="text" 
                                    id="firstName" 
                                    name="firstName" 
                                    required
                                    class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-apple-red transition-colors duration-200"
                                    placeholder="John">
                            </div>
                            <div>
                                <label for="lastName" class="block text-sm font-semibold text-apple-dark mb-2">
                                    Last Name <span class="text-apple-red">*</span>
                                </label>
                                <input 
                                    type="text" 
                                    id="lastName" 
                                    name="lastName" 
                                    required
                                    class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-apple-red transition-colors duration-200"
                                    placeholder="Doe">
                            </div>
                        </div>

                        <!-- Email -->
                        <div>
                            <label for="email" class="block text-sm font-semibold text-apple-dark mb-2">
                                Email Address <span class="text-apple-red">*</span>
                            </label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                required
                                class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-apple-red transition-colors duration-200"
                                placeholder="john@example.com">
                        </div>

                        <!-- Phone Number -->
                        <div>
                            <label for="phone" class="block text-sm font-semibold text-apple-dark mb-2">
                                Phone Number <span class="text-apple-red">*</span>
                            </label>
                            <input 
                                type="tel" 
                                id="phone" 
                                name="phone" 
                                required
                                class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-apple-red transition-colors duration-200"
                                placeholder="(123) 456-7890">
                        </div>

                        <!-- Area of Expertise/Interest -->
                        <div>
                            <label for="expertise" class="block text-sm font-semibold text-apple-dark mb-2">
                                What area of expertise/interest would you like to volunteer? <span class="text-apple-red">*</span>
                            </label>
                            <textarea 
                                id="expertise" 
                                name="expertise" 
                                required
                                rows="5"
                                class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-apple-red transition-colors duration-200 resize-none"
                                placeholder="Tell us about your skills, experience, and how you'd like to contribute to our mission..."></textarea>
                        </div>

                        <!-- Submit Button -->
                        <div class="pt-4">
                            <button 
                                type="submit" 
                                class="w-full chip-btn-primary py-3 font-semibold text-lg rounded-lg transition-all duration-200 hover:shadow-lg">
                                Send Message
                            </button>
                        </div>

                        <!-- Success Message (Hidden by default) -->
                        <div id="successMessage" class="hidden bg-green-100 border-2 border-green-500 text-green-700 px-6 py-4 rounded-lg">
                            <p class="font-semibold">Thank you! Your message has been sent successfully.</p>
                            <p class="text-sm">We'll get back to you as soon as possible.</p>
                        </div>
                    </form>
                </div>

                <!-- Additional Info -->
                 <div class="mt-12 grid grid-cols-1 md:grid-cols-3 gap-6 text-center">
                    <div class="bg-apple-bg rounded-2xl p-6 border border-apple-red/20">
                        <i data-lucide="mail" class="w-8 h-8 text-apple-red mx-auto mb-3"></i>
                        <h3 class="text-apple-dark font-semibold mb-2">Email</h3>
                        <p class="text-apple-dark text-sm">chipnaway113@gmail.com</p>
                    </div>
                    <div class="bg-apple-bg rounded-2xl p-6 border border-apple-red/20">
                        <i data-lucide="phone" class="w-8 h-8 text-apple-red mx-auto mb-3"></i>
                        <h3 class="text-apple-dark font-semibold mb-2">Phone</h3>
                        <p class="text-apple-dark text-sm">(555) 123-4567</p>
                    </div>
                    <div class="bg-apple-bg rounded-2xl p-6 border border-apple-red/20">
                        <i data-lucide="map-pin" class="w-8 h-8 text-apple-red mx-auto mb-3"></i>
                        <h3 class="text-apple-dark font-semibold mb-2">Location</h3>
                        <p class="text-apple-dark text-sm">Your City, State</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Shared Footer insert -->
    <div id="shared-footer"></div>

</body>
</html>
